<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>AFA</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #101014; color: #e8e8ea;
    font: 14px/1.6 "Microsoft YaHei UI", system-ui, sans-serif;
  }
  main { text-align: center; }
  h1 { margin: 0 0 8px; font-size: 18px; font-weight: 600; }
  p { margin: 0; color: #9a9aa2; }
</style>
</head>
<body>
<main>
  <h1>AFA <span id="version">-</span></h1>
  <p id="state">loading</p>
</main>
<script type="module">
  const versionEl = document.getElementById('version');
  const stateEl = document.getElementById('state');
  const webview = window.chrome && window.chrome.webview;
  const pending = new Map();
  let seq = 0;

  function call(method, params = {}) {
    return new Promise((resolve, reject) => {
      const id = ++seq;
      pending.set(id, { resolve, reject });
      webview.postMessage({ v: 1, type: 'call', id, method, params });
      setTimeout(() => {
        if (pending.delete(id))
          reject(new Error(`timeout: ${method}`));
      }, 5000);
    });
  }

  function onMessage(event) {
    const msg = event.data;
    if (!msg || typeof msg !== 'object')
      return;
    if (msg.type === 'welcome') {
      versionEl.textContent = msg.app && msg.app.version ? msg.app.version : '(unknown)';
      stateEl.textContent = 'connected';
      call('app.getState')
        .then(app => {
          stateEl.textContent = `connected · ${app.locale} · ${app.theme} · ${app.engine}`;
        })
        .catch(err => {
          stateEl.textContent = `error: ${err.message}`;
        });
      return;
    }
    if (msg.type === 'reply' && pending.has(msg.id)) {
      const request = pending.get(msg.id);
      pending.delete(msg.id);
      if (msg.ok)
        request.resolve(msg.result);
      else
        request.reject(new Error(msg.error && msg.error.message ? msg.error.message : 'request failed'));
    }
  }

  if (!webview) {
    stateEl.textContent = 'not running in AFA';
  } else {
    webview.addEventListener('message', onMessage);
    webview.postMessage({ v: 1, type: 'ready' });
  }
</script>
</body>
</html>
